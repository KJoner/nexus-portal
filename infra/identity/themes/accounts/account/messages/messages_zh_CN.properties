# 账号控制台（Keycloak 账号控制台 v3）里的几个词：自带翻译用「帐户」「登陆」，这里统一成「账号」「登录」。
# 「网页登录 / 退出所有浏览器」等设备页文字在 realm 本地化（texts/account-texts.*.json）。
accountSecurity=登录与安全
signingIn=登录方式
applications=已授权的应用
personalInfo=个人资料
client_account-console=账号中心

# 用户资料（profiles/user-profile.json 里引用的键，v12.0.3 I1）：个人资料页的字段名与说明
username=用户名
nickname=昵称
email=邮箱
acUsernameHelp=用于登录，创建后不能修改。
acNicknameHelp=用于展示，可与其他人重复，可以留空。
acEmailHelp=用于验证账号和找回账号密码。
accountUpdatedMessage=账号资料已更新。

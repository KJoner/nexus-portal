# 账号控制台（Keycloak 26 账号控制台 v3）里的文字。自带翻译用「帐户」「登陆」，这里统一成「账号」「登录」，
# 并按 v12.0.3 原型（litesync-nexus-ui-v2 prototype/identity.html #account / #security）的说法写。
# 「网页登录 / 已登录的浏览器 / 退出所有浏览器」等设备页文字在 realm 本地化（texts/account-texts.*.json），优先于这里。

# 导航与页头（导航的结构在 resources/content.json）
personalInfo=个人资料
personalInfoDescription=用户名用于登录，不能修改；昵称用于展示，可与别人重复；修改邮箱后需要重新验证。LiteSync 的仓库密码与账号密码相互独立。
accountSecurity=登录与安全
signingIn=登录与安全
signingInDescription=管理账号密码与两步验证。账号密码用于登录 LiteSync 和 Nexus，不是仓库密码。
applications=已授权的应用
client_account-console=账号中心
backTo=返回 {{app}}
manageAccount=管理账号
signOut=退出登录
signOutWarning=确定让这个浏览器退出账号中心吗？它上面 LiteSync、Nexus 的网页也会随之退出；已连接的 Obsidian 与浏览器扩展不受影响。
deleteAccount=删除账号

# 个人资料（profiles/user-profile.json 里引用的键，v12.0.3 I1）：字段名与说明。
# 注意：Keycloak 26.8 的账号控制台 v3 不显示 inputHelperTextAfter（字段下方的说明只在注册 / 补充资料页出现），
# 所以这页的要点写在上面的 personalInfoDescription 里；下面的 ac*Help 留着给以后支持说明文字的版本。
username=用户名
nickname=昵称
email=邮箱
acUsernameHelp=用于登录，创建后不能修改；原有的邮箱用户名继续有效。
acNicknameHelp=用于展示，可与其他人重复，可以留空。修改昵称不会改变登录用户名或已有数据。
acEmailHelp=用于找回账号密码与账号通知。修改后需要重新验证。
general=基本资料
selectALocale=界面语言
save=保存修改
accountUpdatedMessage=账号资料已更新。

# 登录与安全（登录方式页）
basic-authentication=账号密码
password-display-name=账号密码
password-help-text=用于登录 LiteSync 和 Nexus，不是仓库密码。
password=当前密码
credentialCreatedAt=<0>设置于</0> {{date}}
update=修改
two-factor=两步验证
otp-display-name=验证器应用
otp-help-text=登录时再输入验证器应用里的一次性验证码。
setUpNew=设置{{name}}
notSetUp=还没有设置{{name}}。

# 网页登录（设备活动页）：页名、说明与「退出所有浏览器」在 realm 本地化里
currentSession=当前浏览器
clients=应用
lastAccessedOn=最近活动
started=登录时间
expires=到期时间
refreshPage=刷新

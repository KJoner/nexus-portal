# 账号中心（Keycloak 26 账号控制台 v3）· UI v2（v12.0.3）：继承 keycloak.v3，不复制它的 React 应用，只用主题机制：
#   - resources/content.json：左侧导航（个人资料 / 登录与安全 / 网页登录；其余按 Keycloak 的开关自动出现）
#   - css/accounts.css：版式与颜色（与登录页同一套变量；手机上导航变成页签）
#   - js/console.js：在 <html> 上标产品强调色、沿用登录页选过的深浅色；窄屏时去掉导航容器的 aria-hidden
#     （导航改成了一直可见的页签），不改 React 渲染的内容
#   - messages/*：用词（「网页登录 / 退出所有浏览器」等设备页文字在 realm 本地化 texts/account-texts.*.json）
# 从产品打开时带 ?referrer=<client>，页头显示「返回 LiteSync / Nexus Portal」（Keycloak 自带，client 名来自 realm）。
parent=keycloak.v3
# 自己的样式、脚本、图片都放在带版本号的目录 resources/ui-v2-1/ 下：Keycloak 给主题资源 30 天缓存，地址里的版本段只随
# Keycloak 版本变，前面的 Cloudflare 还会忽略查询参数，所以改了文件却不换目录，用户会拿到旧文件（v12.0.3 预发布实测）。
# 任何一个文件有改动就把目录换成新名字（例如 ui-v2-2），并同步本文件、登录主题的 acAssets 与测试。
styles=ui-v2-1/css/accounts.css
scripts=ui-v2-1/js/console.js
logo=ui-v2-1/img/logo.svg
favIcon=/ui-v2-1/img/logo.svg
title=账号中心
description=管理 LiteSync 与 Nexus 共用的账号：个人资料、账号密码与网页登录。

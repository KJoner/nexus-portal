# 账号中心（LiteSync 与 Nexus 共用）的登录、注册、找回账号密码、验证邮箱页面。
# 继承 Keycloak 26 自带的 keycloak.v2（PatternFly 5）：不复制任何模板，只换样式变量与文字，
# 升级 Keycloak 时跟着上游模板走。两个产品各有一个子主题（accounts-nexus / accounts-litesync），
# 在 realm 的 client 上指定，页面因此能说明「登录后回到哪个产品」并用该产品的强调色。
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/accounts.css
darkMode=true

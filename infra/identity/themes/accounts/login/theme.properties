# 账号中心（LiteSync 与 Nexus 共用）的登录、注册、找回账号密码、验证邮箱等页面。
# 继承 Keycloak 26 自带的 keycloak.v2（PatternFly 5）。UI v2（v12.0.3）起覆盖一个文件：公共外壳
# template.ftl（左侧品牌与装饰图、右侧表单），各页面模板与动态字段仍用上游的；升级 Keycloak 时先对照
# 新版的 template.ftl（README「账号中心的样子」）。两个产品各有一个子主题（accounts-nexus / accounts-litesync），
# 在 realm 的 client 上指定，页面因此能说明「登录后返回哪个产品」并用该产品的强调色。
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/accounts.css
darkMode=true

name: nexus

# Nexus Portal on a VPS: one container from Docker Hub, behind your HTTPS reverse proxy.
# Easiest: scripts/deploy.sh installs, updates (with backups) and sets the password.
# By hand:
#   cp .env.example .env      # fill in NEXUS_PASSWORD_HASH (deploy.sh --password), NEXUS_SECRET, NEXUS_VERSION
#   docker compose up -d
# Local changes belong in compose.override.yaml, which deploy.sh never touches.
# To build from this checkout instead of pulling:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  nexus:
    image: ${NEXUS_IMAGE:-kjoner/nexus-portal}:${NEXUS_VERSION:-latest}
    container_name: nexus
    restart: unless-stopped
    ports:
      # Localhost only by default: the reverse proxy on this host terminates HTTPS.
      - "${NEXUS_BIND:-127.0.0.1}:${NEXUS_PORT:-8787}:8787"
    environment:
      # Argon2id hash written by deploy.sh; .env never holds the password itself. The plain
      # NEXUS_PASSWORD of older deployments still works. With neither, the stored password stays.
      NEXUS_PASSWORD_HASH: ${NEXUS_PASSWORD_HASH:-}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD:-}
      NEXUS_SECRET: ${NEXUS_SECRET:?在 .env 中设置 NEXUS_SECRET（openssl rand -base64 32）}
      NEXUS_TRUST_PROXY: ${NEXUS_TRUST_PROXY:-1}
      NEXUS_ALLOWED_ORIGINS: ${NEXUS_PUBLIC_URL:-}
      # 留空由服务端决定：自托管单用户默认允许（与以前一样），配置了统一身份的公开部署默认禁止
      NEXUS_HEALTH_ALLOW_PRIVATE: ${NEXUS_HEALTH_ALLOW_PRIVATE:-}
      NEXUS_COOKIE_SECURE: ${NEXUS_COOKIE_SECURE:-auto}
      NEXUS_UNSPLASH_ACCESS_KEY: ${NEXUS_UNSPLASH_ACCESS_KEY:-}
      NEXUS_LITESYNC_URL: ${NEXUS_LITESYNC_URL:-}
      # v0.4 公开部署（多账号）：统一身份 + PostgreSQL，见 infra/identity/README.md。
      # 全部留空 = 自托管单用户（SQLite + 访问密码），与以前一样。
      NEXUS_PUBLIC_URL: ${NEXUS_PUBLIC_URL:-}
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:-}
      NEXUS_OIDC_ISSUER: ${NEXUS_OIDC_ISSUER:-}
      NEXUS_OIDC_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-}
      NEXUS_OIDC_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET:-}
      NEXUS_REGISTRATION_MODE: ${NEXUS_REGISTRATION_MODE:-invite}
      NEXUS_LEGACY_PASSWORD_LOGIN: ${NEXUS_LEGACY_PASSWORD_LOGIN:-auto}
      NEXUS_MAIL_PROVIDER: ${NEXUS_MAIL_PROVIDER:-log}
      NEXUS_MAIL_FROM: ${NEXUS_MAIL_FROM:-}
      NEXUS_MAIL_REPLY_TO: ${NEXUS_MAIL_REPLY_TO:-}
      NEXUS_SMTP_URL: ${NEXUS_SMTP_URL:-}
      NEXUS_RESEND_API_KEY: ${NEXUS_RESEND_API_KEY:-}
      NEXUS_QUOTA_ITEMS: ${NEXUS_QUOTA_ITEMS:-}
      NEXUS_QUOTA_WALLPAPERS: ${NEXUS_QUOTA_WALLPAPERS:-}
      NEXUS_QUOTA_ICONS: ${NEXUS_QUOTA_ICONS:-}
      NEXUS_QUOTA_STORAGE_MB: ${NEXUS_QUOTA_STORAGE_MB:-}
    volumes:
      - nexus-data:/data
    # Everything the app writes lives in /data.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexus-data:

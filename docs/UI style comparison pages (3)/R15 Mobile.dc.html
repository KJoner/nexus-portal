<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;search&quot;,&quot;apps&quot;,&quot;sheet&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'search'|'apps'|'sheet'&quot;},&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statusScenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warn&quot;,&quot;error&quot;,&quot;unknown&quot;,&quot;off&quot;,&quot;all&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;toastDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:390,&quot;tsType&quot;:&quot;number&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:844,&quot;tsType&quot;:&quot;number&quot;}}">

  componentDidMount() { if (window.NX_R1) this.ready(); else this.poll = setInterval(() => { if (window.NX_R1) { clearInterval(this.poll); this.ready(); } }, 50); }

  ready() {
    const D = window.NX_R1, p = this.props, st = {}, def = D.APPS.filter(a => a.pin).map(a => a.id);
    if (p.view === 'sheet') st.sheet = { id: 'github', from: 'home' };
    if (p.toastDemo) { st.pins = def.filter(x => x !== 'notion'); st.toast = { msg: '已从首页移除 Notion', undo: { pins: def, hidden: [] } }; }
    this.setState(st);
  }
  home() { this.setState({ mode: 'home', q: '' }); this.inRef.current && this.inRef.current.blur(); }
  pinsOf() { const D = window.NX_R1 || EMPTY; return this.state.pins ?? D.APPS.filter(a => a.pin).map(a => a.id); }
  app(id) { const D = window.NX_R1 || EMPTY; return D.APPS.find(a => a.id === id) || D.HOSTED.find(a => a.id === id) || { name: id }; }
  armToast() { clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: null }), 5000); }
  say(t) { this.setState({ toast: t, sheet: null }); this.armToast(); }
  commit(next, msg) { const snap = { pins: this.pinsOf(), hidden: this.state.hidden }; this.setState({ ...next, sheet: null, toast: { msg, undo: snap } }); this.armToast(); }
  move(id, d) { const ps = [...this.pinsOf()], i = ps.indexOf(id), j = i + d; if (j < 0 || j >= ps.length) return; [ps[i], ps[j]] = [ps[j], ps[i]]; this.setState({ pins: ps, sheet: null }); }
  pin(id) { const ps = this.pinsOf(); if (ps.length >= MAXPIN) return this.say({ msg: `首页网站已满 ${MAXPIN} 个，先移除一个`, tone: 'warn' }); this.commit({ pins: [...ps, id] }, `已添加 ${this.app(id).name} 到首页`); }
  longPress(id, from) { return e => { this.lpFired = false; clearTimeout(this.lp); this.setState({ pressed: id }); this.lp = setTimeout(() => { this.lpFired = true; navigator.vibrate && navigator.vibrate(8); this.setState({ sheet: { id, from }, pressed: null }); }, 480); }; }

  renderVals() {
    const D = window.NX_R1 || EMPTY, I = window.NX_ICONS || {};
    const scn = this.props.statusScenario ?? 'ok';
    const W = this.props.width ?? 390, H = this.props.height ?? 844, small = H < 760;
    const { mode, q, engine, hidden, sheet, toast, pressed } = this.state;
    const home = mode === 'home', search = mode === 'search', apps = mode === 'apps';
    const pins = this.pinsOf();
    const pill = D.summary(scn);
    const actOf = h => ({ warn: ['rgba(227,163,91,0.2)', h.color], error: ['rgba(233,118,95,0.22)', h.color], unknown: ['rgba(239,234,225,0.12)', '#efeae1'] }[h.level] || ['rgba(239,234,225,0.07)', 'rgba(239,234,225,0.8)']);
    const hosted = D.hosted(scn).map(h => ({ ...h, rowBg: h.level === 'ok' || h.level === 'off' ? 'transparent' : 'rgba(239,234,225,0.045)', actBg: actOf(h)[0], actFg: actOf(h)[1] }));
    const eng = D.ENGINES.find(e => e.id === engine) || D.ENGINES[0];
    const tapOf = a => e => { e.preventDefault(); clearTimeout(this.lp); if (this.lpFired) { this.lpFired = false; return; } this.say({ msg: `演示 · 将打开 ${a.domain || a.name}`, tone: 'info' }); };
    const menuOf = (id, from) => e => { e.preventDefault(); clearTimeout(this.lp); this.lpFired = true; this.setState({ sheet: { id, from }, pressed: null }); };

    const sites = pins.map(id => D.APPS.find(a => a.id === id)).filter(Boolean).map(a => ({ ...a, ...D.tileOf(a), badgeD: 'none', color: 'transparent' }));
    const homeApps = [...sites, ...hosted].map(a => ({ ...a, aria: a.hosted ? `${a.name}，${a.levelLabel}` : a.name, t: pressed === a.id ? 'scale(.92)' : 'none',
      tap: tapOf(a), down: this.longPress(a.id, a.hosted ? 'hosted' : 'home'), menu: menuOf(a.id, a.hosted ? 'hosted' : 'home') }));

    const fl = apps ? q.trim().toLowerCase() : '';
    const match = a => !fl || (a.name + ' ' + a.domain + ' ' + (a.alias || '')).toLowerCase().includes(fl);
    const cats = D.CATS.map(c => ({ label: c.label, apps: D.APPS.filter(a => a.cat === c.id && match(a) && !hidden.includes(a.id)).map(a => ({ ...a, ...D.tileOf(a), pinDot: pins.includes(a.id) ? '#e6c08a' : 'transparent', aria: a.name + (pins.includes(a.id) ? '，已在首页' : ''), tap: tapOf(a), down: this.longPress(a.id, 'apps'), menu: menuOf(a.id, 'apps') })) })).filter(c => c.apps.length);
    const hostedM = hosted.filter(match);
    const sections = search ? D.search(q, engine, { max: 2 }).map((sec, si) => ({ title: sec.title, rows: (q.trim() ? sec.rows : sec.rows.slice(0, 2)).map((r, ri) => ({ ...r, bg: si === 0 && ri === 0 && q.trim() ? 'rgba(239,234,225,0.08)' : 'transparent', go: e => { e.preventDefault(); this.home(); } })) })) : [];
    const breathe = pill.level === 'error' ? 'nx-breathe 2.4s ease-in-out infinite' : 'none';
    const contentPad = apps ? 40 : (search ? 10 : 14);
    const searchMask = { tileBg: 'transparent', tileShadow: 'none', glyph: 'none', gsize: '0', mask: I.search || 'none', maskBg: 'rgba(239,234,225,0.6)' };

    let asV = { name: '', sub: '' }, asItems = [];
    if (sheet) {
      const a = this.app(sheet.id), isH = sheet.from === 'hosted', i = pins.indexOf(sheet.id), pinned = i >= 0;
      asV = { ...D.tileOf(isH ? { ...a, hosted: true } : a), name: a.name, sub: isH ? '自托管服务 · 在设置中管理' : a.domain };
      const it = (label, icon, fn, o = {}) => ({ label, icon: I[icon] || 'none', fn, hint: o.hint || '', disabled: !!o.disabled, op: o.disabled ? 0.4 : 1, fg: o.danger ? '#f0a594' : '#efeae1' });
      const toSet = it('在设置中编辑', 'pencil', () => this.say({ msg: `演示 · 设置 › 应用与服务 › ${a.name}`, tone: 'info' }), { hint: '›' });
      if (isH) asItems = [it('查看状态', 'activity', () => this.setState({ sheet: null, mode: 'apps', q: '' })), toSet];
      else if (sheet.from === 'home') asItems = [
        it('向前移动', 'chevron-left', () => this.move(sheet.id, -1), { disabled: i <= 0 }),
        it('向后移动', 'chevron-right', () => this.move(sheet.id, 1), { disabled: i >= pins.length - 1 }),
        it('从首页移除', 'pin-off', () => this.commit({ pins: pins.filter(x => x !== sheet.id) }, `已从首页移除 ${a.name}`)),
        it('隐藏此应用', 'eye-off', () => this.commit({ pins: pins.filter(x => x !== sheet.id), hidden: [...hidden, sheet.id] }, `已隐藏 ${a.name}`), { danger: true }), toSet];
      else asItems = [
        pinned ? it('从首页移除', 'pin-off', () => this.commit({ pins: pins.filter(x => x !== sheet.id) }, `已从首页移除 ${a.name}`), { hint: `${pins.length}/${MAXPIN}` })
               : it('添加到首页', 'pin', () => this.pin(sheet.id), { hint: `${pins.length}/${MAXPIN}` }),
        it('隐藏此应用', 'eye-off', () => this.commit({ pins: pins.filter(x => x !== sheet.id), hidden: [...hidden, sheet.id] }, `已隐藏 ${a.name}`), { danger: true }), toSet];
    }
    const tv = toast || {};
    const toastV = { msg: tv.msg || '', dot: DOT[tv.tone] || (tv.undo ? '#e6c08a' : DOT.ok), actD: tv.undo ? 'block' : 'none', actLabel: '撤销',
      act: () => { if (tv.undo) { this.setState({ pins: tv.undo.pins, hidden: tv.undo.hidden, toast: { msg: '已撤销', tone: 'ok' } }); this.armToast(); } } };
    const sheetB = home ? 24 : 0, sheetHpx = 330;

    return {
      i: I, W: W + 'px', H: H + 'px', kb: search, tile: W < 380 ? '56px' : '60px',
      clockTop: small ? '52px' : '72px', clockSize: small ? '50px' : '58px',
      pill, pillLabel: `服务状态：${pill.text}，查看全部应用`,
      pillDot: React.createElement('span', { style: { width: 6, height: 6, borderRadius: '50%', background: pill.color, animation: breathe, flex: 'none' } }),
      homeApps, showAdd: sites.length < MAXPIN,
      lpCancel: () => { clearTimeout(this.lp); if (this.state.pressed) this.setState({ pressed: null }); },
      allTile: D.tileOf({ kind: 'all' }),
      photoT: home ? 'none' : 'scale(1.05)', photoF: home ? 'none' : 'blur(10px) brightness(.7)',
      topO: home ? 1 : 0,
      sheetX: home ? '10px' : '0px', sheetB: sheetB + 'px', sheetH: home ? sheetHpx + 'px' : 'calc(100% - 52px)',
      sheetR: home ? '34px 34px 34px 34px' : '30px 30px 0px 0px',
      sheetBg: home ? 'rgba(26,25,22,0.5)' : 'rgba(28,26,23,0.72)',
      rowB: contentPad + 'px', contentB: (contentPad + 52 + 8) + 'px',
      toastB: (sheetB + contentPad + 52 + 12) + 'px',
      homeO: home ? 1 : 0, homeT: home ? 'none' : 'translateY(-10px)', homePE: home ? 'auto' : 'none',
      searchO: search ? 1 : 0, searchT: search ? 'none' : 'translateY(12px)', searchPE: search ? 'auto' : 'none',
      appsO: apps ? 1 : 0, appsT: apps ? 'none' : 'translateY(12px)', appsPE: apps ? 'auto' : 'none',
      sections,
      engines: D.ENGINES.map(e => ({ ...e, ...D.engIcon(e), name: e.id === 'links' ? '收藏' : e.name, selS: String(e.id === engine), bg: e.id === engine ? 'rgba(239,234,225,0.16)' : 'rgba(239,234,225,0.06)', ring: e.id === engine ? 'inset 0 0 0 1px rgba(239,234,225,0.16)' : 'none', fg: e.id === engine ? '#efeae1' : 'rgba(239,234,225,0.7)', pick: () => this.setState({ engine: e.id }) })),
      keep: e => e.preventDefault(),
      lead: search ? D.engIcon(eng) : { ...searchMask },
      inRef: this.inRef, q, hasQ: !!q,
      placeholder: apps ? '筛选应用' : (engine === 'links' && search ? '在收藏中查找' : '搜索、网址或应用'),
      onQ: e => this.setState({ q: e.target.value }),
      onFocus: () => { if (this.state.mode === 'home') this.setState({ mode: 'search' }); },
      clearQ: () => { this.setState({ q: '' }); this.inRef.current && this.inRef.current.focus(); },
      fieldBg: home ? 'rgba(239,234,225,0.09)' : 'rgba(239,234,225,0.11)',
      fieldRing: search ? 'inset 0 0 0 1px rgba(230,192,138,0.4)' : 'none',
      sideAct: () => home ? this.setState({ mode: 'apps', q: '' }) : this.home(),
      sideLabel: home ? '全部应用' : (search ? '取消' : '完成'),
      sideText: search ? '取消' : '完成',
      sideIconD: home ? 'block' : 'none', sideTextD: home ? 'none' : 'block',
      sidePad: home ? '0px' : '16px',
      sideBg: home && D.GLASS ? D.GLASS.bg : 'transparent',
      sideRing: home && D.GLASS ? D.GLASS.shadow : 'none',
      openApps: e => { e && e.preventDefault && e.preventDefault(); this.setState({ mode: 'apps', q: '' }); },
      grab: () => this.setState(s => ({ mode: s.mode === 'home' ? 'apps' : 'home', q: '' })), grabLabel: home ? '展开全部应用' : '收起',
      cats, hostedM, showHostedM: hostedM.length > 0, appsEmpty: !!fl && !cats.length && !hostedM.length,
      toWeb: () => this.setState({ mode: 'search' }),
      countText: `${D.APPS.length + D.HOSTED.length - hidden.length} 个`,
      toast: toastV, toastO: toast ? 1 : 0, toastT: toast ? 'none' : 'translateY(8px)', toastPE: toast ? 'auto' : 'none',
      as: asV, asItems, sheetHidden: String(!sheet), asPE: sheet ? 'auto' : 'none', asO: sheet ? 1 : 0,
      asT: sheet ? 'none' : 'translateY(calc(100% + 60px))', asB: '30px',
      closeSheet: () => this.setState({ sheet: null }),
    };
  }
}
</script>
</body>
</html>
